name: Daily SPX Data Fetch

on:
  schedule:
    # === HORARIO DE VERANO (CEST, UTC+2) — actualmente activo ===
    # 14:00 UTC = 16:00 Madrid (CEST) = 10:00 NY (EDT) = +30 min tras apertura
    - cron: '0 14 * * 1-5'
    # === HORARIO DE INVIERNO (CET, UTC+1) ===
    # En invierno, comentar la línea de arriba y descomentar esta:
    # - cron: '0 15 * * 1-5'  # 15:00 UTC = 16:00 Madrid (CET) = 10:00 NY (EST)
  workflow_dispatch:  # Permite disparar manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fetch script
        run: python fetch_daily.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Auto fetch $(date -u +%Y-%m-%d_%H%M)" && git push)
