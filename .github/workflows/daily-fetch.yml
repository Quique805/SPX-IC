name: Daily SPX Data Fetch

on:
  # Primary trigger: repository_dispatch from cron-job.org.
  # We avoid schedule around the US open because GitHub Actions cron can queue
  # during 13-14 UTC peaks, which is unacceptable for the entry signal.
  repository_dispatch:
    types: [fetch_data]
  # Night fallback for the close snapshot only. This is late, but it prevents
  # losing the previous-close lab photo if cron-job.org or a hosted runner fails.
  # Summer: 23:45 Madrid. Winter: 22:45 Madrid.
  schedule:
    - cron: '45 21 * * 1-5'
  # Manual trigger from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spx-daily-fetch-and-email
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fetch script
        run: python fetch_daily.py

      - name: Generate GEX model lab data
        run: python gex_models.py

      - name: Generate DEX model lab data
        run: python dex_models.py

      - name: Generate ML dataset
        run: python ml_dataset.py

      - name: Generate ML Shadow paper model
        run: python ml_shadow.py

      - name: Generate signal and send scheduled card
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: python automate_signals.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Auto fetch $(date -u +%Y-%m-%d_%H%M)"
          # Retry up to 3 times if the remote changes while this workflow runs.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "All push attempts failed."
          exit 1
