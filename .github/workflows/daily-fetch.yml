name: Daily SPX Data Fetch

on:
  schedule:
    # GitHub Actions cron es best-effort: puede retrasarse horas o saltarse durante
    # picos de carga. Solución: múltiples disparos en la ventana objetivo.
    # El script tiene dedup → solo el PRIMERO en correr captura la cadena;
    # los siguientes hacen no-op si el JSON de hoy ya existe.
    # === HORARIO DE VERANO (CEST, UTC+2) — actualmente activo ===
    # Ventana buena: 10:00-10:30 NY = 16:00-16:30 Madrid = 14:00-14:30 UTC
    - cron: '7 14 * * 1-5'   # 16:07 Madrid (1er intento)
    - cron: '17 14 * * 1-5'  # 16:17 Madrid (2º intento si falla el 1º)
    - cron: '27 14 * * 1-5'  # 16:27 Madrid (3er intento si fallan los 2 anteriores)
    # === HORARIO DE INVIERNO (CET, UTC+1) ===
    # En invierno, comentar las 3 líneas de arriba y descomentar estas 3:
    # - cron: '7 15 * * 1-5'   # 16:07 Madrid (1er intento)
    # - cron: '17 15 * * 1-5'  # 16:17 Madrid (2º intento)
    # - cron: '27 15 * * 1-5'  # 16:27 Madrid (3er intento)
  workflow_dispatch:  # Permite disparar manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fetch script
        run: python fetch_daily.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Auto fetch $(date -u +%Y-%m-%d_%H%M)"
          # Reintenta hasta 3 veces si remoto cambia mientras pusheamos (race condition)
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "All push attempts failed."
          exit 1
