name: Daily SPX Data Fetch

on:
  schedule:
    # 15:00 UTC = 11:00 ET en verano (EDT) / 10:00 ET en invierno (EST)
    # Captura ~30-90 min tras apertura de NY (margen para DST)
    - cron: '0 15 * * 1-5'
  workflow_dispatch:  # Permite disparar manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fetch script
        run: python fetch_daily.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Auto fetch $(date -u +%Y-%m-%d_%H%M)" && git push)
