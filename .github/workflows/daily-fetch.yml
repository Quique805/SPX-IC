name: Daily SPX Data Fetch

on:
  # Trigger principal: evento repository_dispatch desde cron-job.org (servicio externo).
  # Se dispara vía HTTP POST a la API de GitHub. Latencia típica: 5-30 segundos.
  # NO usamos `schedule` aquí porque GitHub Actions cron tiene 5-6h de cola en
  # picos de carga (13-14 UTC = apertura US), inaceptable para nuestro caso.
  repository_dispatch:
    types: [fetch_data]
  # Permite disparar manualmente desde la pestaña Actions (botón Run workflow):
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spx-daily-fetch-and-email
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fetch script
        run: python fetch_daily.py

      - name: Generate GEX model lab data
        run: python gex_models.py

      - name: Generate DEX model lab data
        run: python dex_models.py

      - name: Generate ML dataset
        run: python ml_dataset.py

      - name: Generate signal and send scheduled card
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: python automate_signals.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Auto fetch $(date -u +%Y-%m-%d_%H%M)"
          # Reintenta hasta 3 veces si remoto cambia mientras pusheamos (race condition)
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "All push attempts failed."
          exit 1
